# Databases for running the test suite (or the app) against something other than SQLite:
#
#   docker compose up -d mysql
#   DB_CONNECTION=mysql DB_PORT=33061 DB_DATABASE=testing DB_PASSWORD=secret php artisan test
#
#   docker compose up -d mariadb     -> DB_CONNECTION=mariadb DB_PORT=33062
#   docker compose up -d postgres    -> DB_CONNECTION=pgsql DB_PORT=54321 DB_USERNAME=postgres
#   docker compose up -d redis       -> OBSERVABILITY_BUDGET_STORE=redis REDIS_PORT=63791

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: testing
    ports:
      - "127.0.0.1:33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-psecret"]
      interval: 5s
      retries: 20

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: testing
    ports:
      - "127.0.0.1:33062:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: testing
    ports:
      - "127.0.0.1:54321:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:63791:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
