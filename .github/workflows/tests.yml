name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: Pint and PHPUnit (SQLite, MySQL, MariaDB, Postgres)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: testing
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Tests on SQLite
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Tests on MySQL 8.4 (upsert alias, Redis budget counters)
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: mysql
          DB_PORT: 3306
          DB_USERNAME: root
          DB_USE_UPSERT_ALIAS: true
          OBSERVABILITY_BUDGET_STORE: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test

      - name: Tests on MariaDB 11.4
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: mariadb
          DB_PORT: 3307
          DB_USERNAME: root
        run: php artisan test

      - name: Tests on Postgres 17
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: pgsql
          DB_PORT: 5432
          DB_USERNAME: postgres
        run: php artisan test
